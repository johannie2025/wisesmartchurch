plugins {
    id 'com.android.application'
}

android {
    namespace 'com.wisedesign.wisechurch'
    compileSdk 34

    defaultConfig {
        applicationId 'com.wisedesign.wisechurch'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '0.1.0'
    }
    buildTypes {
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'org.java-websocket:Java-WebSocket:1.5.6'
}
