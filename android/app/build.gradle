plugins {
    id 'com.android.application'
}

android {
    namespace 'com.wisedesign.wisechurch'
    compileSdk 34

    defaultConfig {
        applicationId 'com.wisedesign.wisechurch'
        minSdk 24
        targetSdk 34
        versionCode 110
        versionName '1.1.0'
    }
    // Signature FIXE (même clé à chaque compilation) : l'APK s'installe par-dessus l'ancienne version
    // sans désinstallation, donc sans perdre Bibles, médias ni réglages.
    signingConfigs {
        wdscs {
            storeFile file('wdscs.keystore')
            storePassword 'wdscs2026'
            keyAlias 'wdscs'
            keyPassword 'wdscs2026'
        }
    }
    buildTypes {
        debug { signingConfig signingConfigs.wdscs }
        release { minifyEnabled false; signingConfig signingConfigs.wdscs }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'org.java-websocket:Java-WebSocket:1.5.6'
}
