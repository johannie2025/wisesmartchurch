name: Build APK (mobile + TV)
on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ['v*']
    paths-ignore: ['server/**','samples/**','README.md']
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with: { node-version: 20 }

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Installer les composants Android SDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Bibliothèques QR (copie locale pour le mode hors-ligne)
        run: |
          mkdir -p web/vendor
          curl -fsSL --retry 3 -o web/vendor/qrcode.min.js https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js
          curl -fsSL --retry 3 -o web/vendor/jsQR.min.js https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js
          curl -fsSL --retry 3 -o web/vendor/jszip.min.js https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js && curl -fsSL --retry 3 -o web/vendor/pdf.min.js https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js && curl -fsSL --retry 3 -o web/vendor/pdf.worker.min.js https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js || true
      - name: three.js (GitHub master.zip)
        run: bash tools/fetch-three.sh

      - name: Synchroniser l'interface web vers les assets Android
        run: |
          mkdir -p android/app/src/main/assets/vendor
          cp web/index.html android/app/src/main/assets/index.html
          # Version compatible anciens WebView (Android TV) : JS en ES2017, CSS sans inset
          npm i --no-save --prefix "$RUNNER_TEMP/ts" typescript >/dev/null 2>&1 || true
          export PATH="$RUNNER_TEMP/ts/node_modules/.bin:$PATH"
          node tools/make-android-html.js || echo '::warning::transpilation ignorée'
          cp web/vendor/*.js android/app/src/main/assets/vendor/
          if ls web/vendor/three/*.js >/dev/null 2>&1; then
            mkdir -p android/app/src/main/assets/vendor/three
            cp web/vendor/three/*.js android/app/src/main/assets/vendor/three/
            echo "three.js inclus dans l'APK :"; ls android/app/src/main/assets/vendor/three
          else
            echo "::warning::three.js absent : l'APK utilisera le moteur WebGL intégré"
          fi

      - uses: gradle/actions/setup-gradle@v4

      - name: Compiler l'APK (debug)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Renommer l'APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/WiseDesign-SmartChurchSystem.apk

      - uses: actions/upload-artifact@v4
        with:
          name: WiseDesign-SmartChurchSystem-apk
          path: dist/*.apk

      - name: Rapports de build (en cas d'échec)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            android/app/build/reports/**
            android/build/reports/**
