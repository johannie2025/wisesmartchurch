name: Build APK (mobile + TV)
on:
  workflow_dispatch:
  push:
    tags: ['v*']
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - name: Télécharger les bibliothèques QR (copie locale, mode hors-ligne)
        shell: bash
        run: |
          mkdir -p web/vendor
          curl -fsSL -o web/vendor/qrcode.min.js https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js
          curl -fsSL -o web/vendor/jsQR.min.js https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js
      - name: Synchroniser l'UI web vers les assets Android
        run: |
          cp web/index.html android/app/src/main/assets/index.html
          mkdir -p android/app/src/main/assets/vendor && cp web/vendor/*.js android/app/src/main/assets/vendor/
      - name: Build APK debug
        working-directory: android
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: WiseChurch-apk
          path: android/app/build/outputs/apk/debug/*.apk
