name: Build APK (mobile + TV)

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Télécharger les bibliothèques QR (copie locale, mode hors-ligne)
        shell: bash
        run: |
          mkdir -p web/vendor
          curl -L -o web/vendor/qrcode.min.js https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js || true
          curl -L -o web/vendor/jsQR.min.js https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js || true

      - name: Build APK debug
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WiseChurch-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
