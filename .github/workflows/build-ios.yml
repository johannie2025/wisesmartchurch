name: Build iOS (iPhone / iPad — Capacitor)
on:
  workflow_dispatch:
  push:
    tags: ['v*']
jobs:
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Bibliothèques web (QR, PDF, ZIP)
        run: |
          mkdir -p web/vendor
          curl -fsSL -o web/vendor/qrcode.min.js https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js
          curl -fsSL -o web/vendor/jsQR.min.js https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js
          curl -fsSL --retry 3 -o web/vendor/jszip.min.js https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js || true
          curl -fsSL --retry 3 -o web/vendor/pdf.min.js https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js || true
          curl -fsSL --retry 3 -o web/vendor/pdf.worker.min.js https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js || true
      - name: three.js (GitHub master.zip)
        shell: bash
        run: bash tools/fetch-three.sh || true
      - name: Projet Capacitor iOS
        run: |
          mkdir -p ios-app && cd ios-app
          npm init -y >/dev/null
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/ios@6
          rm -rf www && cp -R ../web www
          cp ../web/icon.png icon.png 2>/dev/null || true
          cat > capacitor.config.json <<'JSON'
          {"appId":"com.wisedesign.wdscs","appName":"WDSCS","webDir":"www","ios":{"contentInset":"always"}}
          JSON
          npx cap add ios
          npx cap sync ios
      - name: Autorisations (caméra, micro, réseau local, photos)
        run: |
          P=ios-app/ios/App/App/Info.plist
          pb() { /usr/libexec/PlistBuddy -c "Add :$1 string $2" "$P" 2>/dev/null || /usr/libexec/PlistBuddy -c "Set :$1 $2" "$P"; }
          pb NSCameraUsageDescription "WDSCS utilise la caméra pour la régie vidéo."
          pb NSMicrophoneUsageDescription "WDSCS utilise le micro pour le son de la régie."
          pb NSLocalNetworkUsageDescription "WDSCS se connecte à la régie sur le réseau local."
          pb NSPhotoLibraryUsageDescription "WDSCS importe vos images et vidéos."
          /usr/libexec/PlistBuddy -c "Add :NSBonjourServices array" "$P" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSBonjourServices:0 string _wdscs._tcp" "$P" 2>/dev/null || true
      - name: Archive (non signée) + IPA
        run: |
          cd ios-app/ios/App
          xcodebuild -project App.xcodeproj -scheme App -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
          mkdir -p Payload && cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qr ../../../wdscs-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: WDSCS-iOS-unsigned-ipa
          path: wdscs-unsigned.ipa
