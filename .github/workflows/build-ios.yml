name: Build iOS (Tauri)
on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags: ['v*']
jobs:
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: 'aarch64-apple-ios,aarch64-apple-ios-sim'
      - name: Bibliothèques QR
        run: |
          mkdir -p web/vendor
          curl -fsSL -o web/vendor/qrcode.min.js https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js
          curl -fsSL -o web/vendor/jsQR.min.js https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js
          curl -fsSL --retry 3 -o web/vendor/jszip.min.js https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js && curl -fsSL --retry 3 -o web/vendor/pdf.min.js https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js && curl -fsSL --retry 3 -o web/vendor/pdf.worker.min.js https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js || true
      - name: three.js (GitHub master.zip)
        shell: bash
        run: bash tools/fetch-three.sh
      - run: npm install
      - run: npx tauri icon web/icon.png
      - name: Init & Build iOS (sans signature Apple Developer)
        run: |
          npx tauri ios init
          npx tauri ios build --ci --export-method development -- --allowProvisioningUpdates CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO
      - name: Générer l'archive .ipa (non signée pour Sideloadly / AltStore / TrollStore)
        run: |
          mkdir -p build_ipa/Payload
          cp -r src-tauri/gen/apple/build/arm64/*.xcarchive/Products/Applications/*.app build_ipa/Payload/ || cp -r src-tauri/gen/apple/build/Release-iphoneos/*.app build_ipa/Payload/
          cd build_ipa && zip -r ../WiseDesign-SmartChurchSystem-ios.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: WiseDesign-SmartChurchSystem-ios
          path: WiseDesign-SmartChurchSystem-ios.ipa
