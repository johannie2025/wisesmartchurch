name: Build EXE (Windows)
on:
  workflow_dispatch:
  push:
    tags: ['v*']
jobs:
  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: dtolnay/rust-toolchain@stable
      - name: Télécharger les bibliothèques QR (copie locale, mode hors-ligne)
        shell: bash
        run: |
          mkdir -p web/vendor
          curl -fsSL -o web/vendor/qrcode.min.js https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js
          curl -fsSL -o web/vendor/jsQR.min.js https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js
      - name: three.js (GitHub master.zip)
        shell: bash
        run: bash tools/fetch-three.sh
      - name: FFmpeg (diffusion RTMP + MP4)
        shell: bash
        run: |
          mkdir -p src-tauri/bin
          curl -fsSL --retry 3 -o ff.zip https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip
          mkdir ffx
          python -c "import zipfile;zipfile.ZipFile('ff.zip').extractall('ffx')"
          FF=$(find ffx -name ffmpeg.exe | head -1)
          test -n "$FF" && cp "$FF" src-tauri/bin/ffmpeg.exe
          rm -rf ff.zip ffx
      - run: npm install
      - run: npx tauri icon web/icon.png
        
      - run: npx tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: WiseChurch-Setup
          path: src-tauri/target/release/bundle/nsis/*.exe
