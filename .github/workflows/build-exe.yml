name: Build EXE (Windows)

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ['v*']
    paths-ignore: ['server/**','samples/**','README.md']

jobs:
  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configurer Rust (toolchain stable)
        shell: bash
        run: |
          rustup default stable
          rustc --version
          cargo --version

      - name: Télécharger les bibliothèques QR (copie locale, mode hors-ligne)
        shell: bash
        run: |
          mkdir -p web/vendor
          curl -fsSL --retry 3 -o web/vendor/qrcode.min.js https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js
          curl -fsSL --retry 3 -o web/vendor/jsQR.min.js https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js
          curl -fsSL --retry 3 -o web/vendor/jszip.min.js https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js && curl -fsSL --retry 3 -o web/vendor/pdf.min.js https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js && curl -fsSL --retry 3 -o web/vendor/pdf.worker.min.js https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js || true

      - name: three.js (GitHub master.zip)
        shell: bash
        run: bash tools/fetch-three.sh

      - name: FFmpeg (diffusion RTMP + MP4)
        shell: bash
        run: |
          mkdir -p src-tauri/bin
          curl -fsSL --retry 3 -o ff.zip https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip
          mkdir ffx
          python -c "import zipfile;zipfile.ZipFile('ff.zip').extractall('ffx')"
          FF=$(find ffx -name ffmpeg.exe | head -1)
          test -n "$FF" && cp "$FF" src-tauri/bin/ffmpeg.exe
          rm -rf ff.zip ffx

      - run: npm install
      - run: npx tauri icon web/icon.png
      - name: Signature du EXE (optionnelle, si le secret WINDOWS_CERT_PFX_BASE64 existe)
        shell: pwsh
        env:
          PFX_B64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          PFX_PWD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          if (-not $env:PFX_B64) { Write-Host "Pas de certificat : EXE non signé"; exit 0 }
          [IO.File]::WriteAllBytes("$PWD\cert.pfx",[Convert]::FromBase64String($env:PFX_B64))
          $sec = ConvertTo-SecureString $env:PFX_PWD -AsPlainText -Force
          $c = Import-PfxCertificate -FilePath cert.pfx -CertStoreLocation Cert:\CurrentUser\My -Password $sec
          node -e "const f='src-tauri/tauri.conf.json',j=JSON.parse(require('fs').readFileSync(f));j.bundle.windows=Object.assign(j.bundle.windows||{},{certificateThumbprint:process.argv[1],digestAlgorithm:'sha256',timestampUrl:'http://timestamp.digicert.com'});require('fs').writeFileSync(f,JSON.stringify(j,null,2))" $c.Thumbprint

      - name: Build EXE (capture WebView2 si possible, sinon build standard)
        shell: bash
        run: npx tauri build --features capture || npx tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: WiseChurch-Setup
          path: src-tauri/target/release/bundle/nsis/*.exe
